allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Gradle 9 a supprime l'affectation directe de buildDir : la relocalisation des
// sorties sous <projet>/build, ou l'outil Flutter va chercher l'APK, passe
// desormais par layout.buildDirectory.
rootProject.layout.buildDirectory = rootProject.layout.projectDirectory.dir("../build")

subprojects {
    layout.buildDirectory = rootProject.layout.buildDirectory.dir(project.name)
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}
